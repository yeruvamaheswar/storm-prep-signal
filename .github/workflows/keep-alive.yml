# Keeps the Render free instance awake so the live ERCOT worker keeps ticking.
# Render's free plan sleeps after ~15 min with no inbound request; the worker's own ERCOT calls do not count.
# GitHub can start scheduled runs late, so a short nap is still possible (docs/agents/live-ingest.md).
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://reservegate-api.onrender.com/health
