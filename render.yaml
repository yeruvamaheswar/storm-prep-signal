# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repo, and Render reads this file.
services:
  - type: web
    name: reservegate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Comma-separated origins allowed to call the API. Add the deployed wall URL here.
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # Which fixture GET /v1/live returns: live-ok, bad-feed, retry-spent, stress-reserve.
      - key: CONSOLE_SCENE
        value: live-ok
      # ERCOT Public API. Set these in the Render dashboard; never commit values.
      - key: ERCOT_USERNAME
        sync: false
      - key: ERCOT_PASSWORD
        sync: false
      - key: ERCOT_SUBSCRIPTION_KEY
        sync: false
      # Optional history. Set these in the Render dashboard; never commit values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
